name: Synthetic world validation
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel away from checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - name: Export and read back bounded fixture
        run: |
          synthdata world --size 120 --seed 197 --scenario trade --output ci-world > ci-metrics.json
          synthdata validate ci-world
          synthdata import-fixture ci-world ci-world.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-python-${{ matrix.python }}
          path: |
            test-results.xml
            ci-metrics.json
            ci-world/
            dist/
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Full Nix package and installed CLI tests
        run: nix flake check --no-update-lock-file -L
      - run: nix build --no-update-lock-file -L
      - run: ./result/bin/synthdata world --size 20 --preview
